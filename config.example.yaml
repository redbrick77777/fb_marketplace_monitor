# Copy this file to config.yaml and fill in your own values:
#   cp config.example.yaml config.yaml
#
# Secrets can also be supplied via environment variables instead of putting
# them in this file: SOCIAVAULT_API_KEY, GOOGLE_SERVICE_ACCOUNT_FILE,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# (env vars take priority over the values below, if both are set).

sociavault_api_key: "sk_live_your_key_here"

# Only needed if at least one watch below uses output_type: google_sheets.
# Leave it out entirely if everything writes to local xlsx files.
# google_service_account_file: "service_account.json"

# Where the dedupe/location-cache database lives. Created automatically.
db_path: "data/seen_listings.db"

# Optional: also write logs to this file (in addition to stdout).
log_file: "logs/monitor.log"

# Optional: get a Telegram push when a watch finds something. Only needed if
# some watch below sets `notify: true`. If one does and this is missing, the
# run carries on as normal and logs an ERROR naming that watch - alerts are
# an extra, and never a reason for the monitor to stop collecting.
# See the README for how to create the bot and find your chat_id.
#
# Worth knowing before you turn it on: cron runs the monitor every 3 hours,
# so an alert can arrive up to 3 hours after the seller posted. Enable it on
# the watches that match rarely, where hearing about it at all is the win -
# a watch that matches dozens of times a day will just become noise.
#
# Leave these as-is if you don't want alerts - they're only read by watches
# that set `notify: true`, and nothing below does by default.
telegram:
  bot_token: "123456789:your_bot_token_from_botfather"
  chat_id: "123456789"             # tmp/get_telegram_chat_id.py prints yours

# One or more searches ("watches"). Each is tracked independently for
# dedupe purposes, and can write to its own file/sheet+tab - this is what
# makes the app reusable for future projects, not just this one.
watches:
  - name: tires_285_70_18_jax          # must be unique across all watches
    city: "Jacksonville, FL"
    radius_miles: 50
    keywords:                          # what must appear in the title to count as a match
      - "285 70 18"
      - "285/70/18"
      - "285/70R18"
      - "LT285/70R18"
    search_terms:                      # what's actually SENT to SociaVault's search.
      - "285 70 18 tires"              # Facebook's own search relevance is poor on bare
      - "LT285/70R18 tires"            # numbers alone - include a plain category word
                                        # like "tires" or you may get zero/few results
                                        # even though the listings clearly exist. If you
                                        # omit search_terms entirely, it falls back to
                                        # using `keywords` as-is (not recommended for
                                        # number-only variants like these).
    check_description: false           # true = also check the listing description if the
                                        # title alone doesn't match (costs 1 extra SociaVault
                                        # credit per non-matching listing - see README)
    exclude_keywords:                  # skip listings whose title matches any of these
      - "rims only"
      - "wheel only"
    price_min: 0
    price_max: 400

    # --- Age limit: skip stale listings. Both keys are optional. ---
    #
    # Facebook keeps showing months-old listings in search results, and they
    # look exactly like new ones once they're in the sheet. The posting date
    # comes back in the search response itself, so rejecting an old listing
    # costs nothing - no geocode, no item-detail credit. Listings dropped for
    # being too old are also the one rejection here that ISN'T marked seen, so
    # widening the window later brings them back instead of losing them.
    #
    # max_age_days: a rolling window, in days back from each run. This is the
    # one you usually want - it keeps working without being touched.
    max_age_days: 30
    #
    # posted_after: a FIXED date instead. Inclusive, and read in local time:
    # 2026-09-01 keeps a listing posted at 09:15 on September 1st. It's the
    # same date shown in the "Posted At" column, so you can pick a cutoff
    # straight off the sheet. Useful for "everything since I reset this watch",
    # but it does not move on by itself - left alone for months it gradually
    # stops filtering anything.
    #posted_after: 2026-09-01
    #
    # Setting both is allowed; whichever cutoff is later applies.

    condition_filter: "used"           # omit this line entirely to skip the condition check
    max_pages: 5                       # search result pages to pull per keyword, per run
    notify: false                      # push a Telegram message when this watch finds
                                        # something. Flip to true once you've filled in the
                                        # `telegram` block above with a real token; setting
                                        # it true without one just logs an error each run.
                                        # Best on rare-but-important watches like this one;
                                        # leave it off for anything that matches many times
                                        # a day, or the alerts become noise.

    # Drop "buy it on eBay"-style partner listings that Facebook surfaces but
    # fulfils off-site (delivery type SHIPPING_OFFSITE). Defaults to true, so
    # you only need this line to turn it OFF.
    #
    # They can't be inspected or picked up in person, and their item detail
    # comes back with an empty location, so they'd be dropped later anyway -
    # this just drops them before spending a credit on that fetch. Note the
    # word "ebay" appears nowhere in the API response (it's Facebook's own
    # branding), so exclude_keywords cannot catch these.
    exclude_offsite: true

    # --- Output: pick ONE of the two blocks below ---

    # Option A (default, zero setup): write to a local .xlsx file.
    output_type: xlsx
    output_file: "output/marketplace_finds.xlsx"
    sheet_tab: "Tires"                 # worksheet name inside that file

    # Option B: write to a Google Sheet instead (needs the service account
    # setup described in the README). Comment out the two lines above and
    # uncomment these three:
    # output_type: google_sheets
    # sheet_id: "your_google_sheet_id_here"
    # sheet_tab: "Tires"

  # Add more searches for other projects here, e.g.:
  # - name: standing_desks_austin
  #   city: "Austin, TX"
  #   radius_miles: 25
  #   keywords: ["standing desk", "sit stand desk"]
  #   price_max: 300
  #   output_type: xlsx
  #   output_file: "output/desks.xlsx"
  #   sheet_tab: "Desks"
